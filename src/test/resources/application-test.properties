# Nombre de la aplicación en contexto de pruebas (aparece en logs y metadata de Spring).
spring.application.name=ACME Learning Center Platform Test

# URL de base en memoria H2 para pruebas aisladas y repetibles.
# MODE=MySQL: emula sintaxis/compatibilidad MySQL para reducir diferencias con producción.
# DB_CLOSE_DELAY=-1: mantiene la base viva durante todo el ciclo de la JVM.
# DB_CLOSE_ON_EXIT=FALSE: evita cierre automático abrupto al finalizar la VM.
spring.datasource.url=jdbc:h2:mem:learning-center-platform;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# Usuario por defecto de H2 en entorno de test.
spring.datasource.username=sa
# Password vacío en test para simplificar la inicialización local.
spring.datasource.password=
# Driver JDBC utilizado por Spring para conectarse a H2.
spring.datasource.driver-class-name=org.h2.Driver

# No imprimir SQL en consola para mantener salida de pruebas limpia.
spring.jpa.show-sql=false
# Crea el esquema al iniciar tests y lo elimina al finalizar (sin afectar otros entornos).
spring.jpa.hibernate.ddl-auto=create-drop
# Desactiva Open Session in View para evitar dependencias de sesión en capa web durante tests.
spring.jpa.open-in-view=false
# Dialecto Hibernate explícito para H2.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Estrategia de nombres: tablas en snake_case y pluralizadas, consistente con el proyecto.
spring.jpa.hibernate.naming.physical-strategy=com.alpacaflow.meditrack.iam.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Metadata de OpenAPI/documentación en perfil de pruebas.
documentation.application.description=ACME Learning Platform test configuration
documentation.application.version=1.0.0-test

# Clave JWT de pruebas (solo entorno test, no usar en producción).
authorization.jwt.secret=01234567890123456789012345678901234567890123456789
# Vigencia del token en días para escenarios de autenticación en tests.
authorization.jwt.expiration.days=7
