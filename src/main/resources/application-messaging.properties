# Profile for local/async integration with ActiveMQ + Organization consumer.
# Run IAM with: --spring.profiles.active=messaging
# Requires broker at ACTIVEMQ_BROKER_URL (default tcp://localhost:61616).

app.messaging.enabled=true
app.organization.adapter=jms

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:meditrack}
spring.activemq.password=${ACTIVEMQ_PASSWORD:meditrack}
