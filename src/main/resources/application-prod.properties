# src/main/resources/application-prod.properties
# This profile is activated for production deployments
# Spring Application Name
spring.application.name=iam

# Spring DataSource Configuration
spring.datasource.url=${MYSQL_CONNECTION}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring JPA Configuration
spring.jpa.show-sql=true

# Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.alpacaflow.meditrack.iam.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# JWT Configuration
authorization.jwt.secret=WriteHereYourSecretStringForTokenSigningCredentials
authorization.jwt.expiration.days=7

spring.cloud.compatibility-verifier.enabled=false

organization.facade.url = ${ORGANIZATION_URL}
relatives.facade.url=${RELATIVES_URL:https://meditrack-relatives-api-e2eyethkfgc4hbfh.eastus-01.azurewebsites.net}

# ActiveMQ (enable when broker is deployed: MESSAGING_ENABLED=true)
app.messaging.enabled=${MESSAGING_ENABLED:false}
app.organization.adapter=${ORGANIZATION_ADAPTER:rest}
app.relatives.adapter=${RELATIVES_ADAPTER:rest}
spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
spring.activemq.user=${ACTIVEMQ_USER:meditrack}
spring.activemq.password=${ACTIVEMQ_PASSWORD:}